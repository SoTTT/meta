name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Windows 的 run 步骤默认用 pwsh，会把 -DOATPP_GIT_TAG=1.3.0 截断成 1（git 报
# "invalid reference: 1"）。统一用 bash（Windows runner 自带 Git Bash）规避参数解析差异。
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # oatpp master 已迁移头文件路径（oatpp/Types.hpp），本库基于 1.3.0 验证，必须固定 tag
      - name: Configure
        run: cmake -B build -DOATPP_GIT_TAG=1.3.0 -DCMAKE_BUILD_TYPE=Release

      # Windows 默认 Visual Studio 多配置生成器，--config Release 对其余平台无害
      - name: Build
        run: cmake --build build --config Release -j

      # 多配置生成器（Windows）产物在 Release/ 子目录；单配置生成器直接在 build/test/
      - name: Test
        run: |
          if [ -f build/test/Release/oatpp_meta_test.exe ]; then
            ./build/test/Release/oatpp_meta_test.exe
          else
            ./build/test/oatpp_meta_test
          fi
